<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRT Residence Time Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxH4-Fj5z9izQifMN3sFQJ7JsINRmHFXwSYHIrlqihwrFMg8VPpwNvYp_KGYwG-Xe-o/exec';
  </script>

  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="bg-slate-800 p-6 rounded-2xl border border-slate-700 flex justify-between items-center shadow-xl">
      <div>
        <h1 class="text-2xl font-black text-white">🚛 TRT Residence Time Tracker</h1>
        <p class="text-xs text-indigo-400 font-semibold">Site Movement & Logistics Operation</p>
      </div>
      <button onclick="refreshData()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-bold transition">
        ↻ Refresh Queue
      </button>
    </header>

    <!-- Active Queue Table -->
    <section class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-xl">
      <div class="p-6 border-b border-slate-700 flex justify-between items-center">
        <h2 class="text-lg font-bold text-white">Active Site Queue</h2>
        <span id="activeBadge" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs font-extrabold px-3 py-1 rounded-full">0 Active</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-900 text-slate-400 uppercase text-[11px] border-b border-slate-700">
              <th class="py-4 px-5">Plate No.</th>
              <th class="py-4 px-5">Shipment Type</th>
              <th class="py-4 px-5">SO Number</th>
              <th class="py-4 px-5">OC Name</th>
              <th class="py-4 px-5">Gate In</th>
              <th class="py-4 px-5">Dwell Time</th>
              <th class="py-4 px-5">Action</th>
            </tr>
          </thead>
          <tbody id="queueTableBody" class="divide-y divide-slate-700">
            <tr><td colspan="7" class="text-center py-8 text-slate-500 italic">Loading active trucks...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- TRT Form -->
    <section class="bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-xl">
      <h2 class="text-lg font-bold text-white mb-6 border-b border-slate-700 pb-3">Record / Update Truck Movement</h2>

      <form id="trtForm" class="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-2">Plate No. *</label>
          <input type="text" id="plateNo" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-bold uppercase text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-2">Shipment Type</label>
          <select id="shipmentType" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
            <option value="Crate">Crate</option>
            <option value="Keg">Keg</option>
            <option value="Raw Material">Raw Material</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-2">Driver Name</label>
          <input type="text" id="driverName" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-2">SO Number</label>
          <input type="text" id="soNumber" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-2">Agent Name</label>
          <input type="text" id="agentName" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-2">OC Name</label>
          <input type="text" id="ocName" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
        </div>

        <!-- Timestamps -->
        <div>
          <div class="flex justify-between mb-1"><label class="text-xs font-bold text-slate-300 uppercase">Gate In</label><button type="button" onclick="setNow('gateIn')" class="text-[10px] text-indigo-400 font-bold">NOW</button></div>
          <input type="datetime-local" id="gateIn" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
        </div>

        <div>
          <div class="flex justify-between mb-1"><label class="text-xs font-bold text-slate-300 uppercase">Bay In Time</label><button type="button" onclick="setNow('bayInTime')" class="text-[10px] text-indigo-400 font-bold">NOW</button></div>
          <input type="datetime-local" id="bayInTime" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
        </div>

        <div>
          <div class="flex justify-between mb-1"><label class="text-xs font-bold text-slate-300 uppercase">Bay Out Time</label><button type="button" onclick="setNow('bayOutTime')" class="text-[10px] text-indigo-400 font-bold">NOW</button></div>
          <input type="datetime-local" id="bayOutTime" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
        </div>

        <div>
          <div class="flex justify-between mb-1"><label class="text-xs font-bold text-slate-300 uppercase">Gate Out Time</label><button type="button" onclick="setNow('gateOutTime')" class="text-[10px] text-indigo-400 font-bold">NOW</button></div>
          <input type="datetime-local" id="gateOutTime" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-2">Delay Reason</label>
          <select id="delayReason" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
            <option value="">None</option>
            <option value="Space Constraints">Space Constraints</option>
            <option value="Unloading Delay">Unloading Delay</option>
            <option value="Gate Queue">Gate Queue</option>
            <option value="Equipment Down">Equipment Down</option>
            <option value="Paperwork / Billing">Paperwork / Billing</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-2">OC Remark</label>
          <input type="text" id="ocRemark" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
        </div>

        <div class="md:col-span-3 flex justify-end gap-3 mt-4">
          <button type="button" onclick="document.getElementById('trtForm').reset()" class="px-5 py-3 border border-slate-700 rounded-xl text-xs font-bold text-slate-400">Clear</button>
          <button type="submit" id="submitBtn" class="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-bold text-white shadow-lg">Save Record</button>
        </div>
      </form>
      <div id="statusMsg" class="hidden mt-4 p-4 text-center rounded-xl text-sm font-bold"></div>
    </section>

  </div>

  <script>
    let activeTrucksData = [];

    function setNow(id) {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById(id).value = now.toISOString().slice(0, 16);
    }

    function formatForInput(val) {
      if (!val) return '';
      const d = new Date(val);
      if (isNaN(d.getTime())) return '';
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 16);
    }

    async function refreshData() {
      const tbody = document.getElementById('queueTableBody');
      tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-500 italic">Syncing queue...</td></tr>`;

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getActive`);
        const data = await response.json();
        activeTrucksData = data.activeTrucks || [];

        document.getElementById('activeBadge').innerText = `${activeTrucksData.length} Active`;

        if (activeTrucksData.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-500">No active trucks on site</td></tr>`;
          return;
        }

        tbody.innerHTML = activeTrucksData.map((item, idx) => `
          <tr class="hover:bg-slate-700/30 transition border-b border-slate-700">
            <td class="py-4 px-5 font-black text-white">${item.plateNo}</td>
            <td class="py-4 px-5">${item.shipmentType}</td>
            <td class="py-4 px-5 text-slate-400">${item.soNumber || '-'}</td>
            <td class="py-4 px-5 text-slate-300">${item.ocName || '-'}</td>
            <td class="py-4 px-5 text-xs text-slate-400 font-mono">${item.gateIn ? new Date(item.gateIn).toLocaleString() : '-'}</td>
            <td class="py-4 px-5 font-bold text-amber-400">${item.dwellHours} hrs</td>
            <td class="py-4 px-5">
              <button onclick="editTruck(${idx})" class="px-3 py-1.5 bg-slate-700 hover:bg-indigo-600 rounded-lg text-xs font-bold transition">Update / Checkout</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-rose-400 font-bold">Failed to load data from database.</td></tr>`;
      }
    }

    function editTruck(idx) {
      const item = activeTrucksData[idx];
      document.getElementById('plateNo').value = item.plateNo || '';
      document.getElementById('shipmentType').value = item.shipmentType || 'Crate';
      document.getElementById('driverName').value = item.driverName || '';
      document.getElementById('soNumber').value = item.soNumber || '';
      document.getElementById('agentName').value = item.agentName || '';
      document.getElementById('ocName').value = item.ocName || '';
      document.getElementById('gateIn').value = formatForInput(item.gateIn);
      document.getElementById('bayInTime').value = formatForInput(item.bayInTime);
      document.getElementById('bayOutTime').value = formatForInput(item.bayOutTime);
      document.getElementById('gateOutTime').value = formatForInput(item.gateOutTime);
      document.getElementById('delayReason').value = item.delayReason || '';
      document.getElementById('ocRemark').value = item.ocRemark || '';

      window.scrollTo({ top: document.getElementById('trtForm').offsetTop - 20, behavior: 'smooth' });
    }

    document.getElementById('trtForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('statusMsg');
      btn.disabled = true;
      btn.innerText = 'Saving...';

      const body = new URLSearchParams();
      body.append('plateNo', document.getElementById('plateNo').value);
      body.append('shipmentType', document.getElementById('shipmentType').value);
      body.append('driverName', document.getElementById('driverName').value);
      body.append('soNumber', document.getElementById('soNumber').value);
      body.append('agentName', document.getElementById('agentName').value);
      body.append('ocName', document.getElementById('ocName').value);
      body.append('gateIn', document.getElementById('gateIn').value);
      body.append('bayInTime', document.getElementById('bayInTime').value);
      body.append('bayOutTime', document.getElementById('bayOutTime').value);
      body.append('gateOutTime', document.getElementById('gateOutTime').value);
      body.append('delayReason', document.getElementById('delayReason').value);
      body.append('ocRemark', document.getElementById('ocRemark').value);

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body.toString()
        });

        msg.innerText = '✓ Saved to TRT_Master_Database!';
        msg.className = 'mt-4 p-4 text-center rounded-xl text-sm font-bold bg-emerald-500/10 text-emerald-300 border border-emerald-500/30';
        document.getElementById('trtForm').reset();
        setTimeout(refreshData, 1000);
      } catch (err) {
        msg.innerText = '❌ Failed to save record.';
        msg.className = 'mt-4 p-4 text-center rounded-xl text-sm font-bold bg-rose-500/10 text-rose-300 border border-rose-500/30';
      } finally {
        msg.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = 'Save Record';
      }
    });

    refreshData();
    setInterval(refreshData, 30000);
  </script>
</body>
</html>
