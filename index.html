<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRT Residence Time Tracker - Hawasa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzy1vNjukPABKAWEmDCuaocIvor7i2jrRguJ6zm5z5RCSHbqbTD-iGRnLxoKPpTaqA/exec';
  </script>

  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700/60 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div class="flex items-center gap-4">
        <div class="h-12 w-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-xl font-black shadow-lg">🚛</div>
        <div>
          <h1 class="text-2xl font-black tracking-tight text-white">TRT Residence Time Tracker</h1>
          <p class="text-xs font-semibold text-indigo-400">Hawasa Terminal & Yard Operations</p>
        </div>
      </div>
      <button onclick="refreshData()" class="w-full md:w-auto px-5 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-bold transition border border-slate-600 shadow flex items-center justify-center gap-2">
        ↻ Refresh Terminal Queue
      </button>
    </header>

    <!-- Volume Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div class="bg-slate-800/60 p-6 rounded-2xl border border-slate-700/50 shadow-lg">
        <h3 class="text-xs font-extrabold text-slate-400 uppercase mb-3">Today's Gate In Volume</h3>
        <div class="flex justify-between items-end">
          <span id="dailyTotal" class="text-4xl font-black text-white">0</span>
          <div class="space-x-2 text-xs font-bold">
            <span class="bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-lg">Crate: <span id="dailyCrate">0</span></span>
            <span class="bg-amber-500/10 text-amber-300 border border-amber-500/30 px-2.5 py-1 rounded-lg">Keg: <span id="dailyKeg">0</span></span>
          </div>
        </div>
      </div>

      <div class="bg-slate-800/60 p-6 rounded-2xl border border-slate-700/50 shadow-lg">
        <h3 class="text-xs font-extrabold text-slate-400 uppercase mb-3">30-Day Total Throughput</h3>
        <div class="flex justify-between items-end">
          <span id="monthlyTotal" class="text-4xl font-black text-white">0</span>
          <div class="space-x-2 text-xs font-bold">
            <span class="bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-lg">Crate: <span id="monthlyCrate">0</span></span>
            <span class="bg-amber-500/10 text-amber-300 border border-amber-500/30 px-2.5 py-1 rounded-lg">Keg: <span id="monthlyKeg">0</span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Active Queue Table -->
    <section class="bg-slate-800/80 rounded-2xl shadow-xl border border-slate-700/60 overflow-hidden">
      <div class="p-6 border-b border-slate-700/60 flex justify-between items-center bg-slate-800/40">
        <h2 class="text-lg font-bold text-white">Active Terminal Queue</h2>
        <span id="activeBadge" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs font-extrabold px-3.5 py-1.5 rounded-full">0 Active</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-900/60 text-slate-400 uppercase text-[11px] tracking-wider border-b border-slate-700/60">
              <th class="py-4 px-5 font-bold">Truck No</th>
              <th class="py-4 px-5 font-bold">Cargo</th>
              <th class="py-4 px-5 font-bold">SO No</th>
              <th class="py-4 px-5 font-bold">OC Name</th>
              <th class="py-4 px-5 font-bold">Gate In</th>
              <th class="py-4 px-5 font-bold">Status</th>
            </tr>
          </thead>
          <tbody id="queueTableBody" class="divide-y divide-slate-700/40 font-medium">
            <tr>
              <td colspan="6" class="text-center py-10 text-slate-500 italic">Loading active yard queue...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    async function refreshData() {
      const tbody = document.getElementById('queueTableBody');

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getActive`);
        const data = await response.json();

        document.getElementById('dailyTotal').innerText = data.counts.daily.total;
        document.getElementById('dailyCrate').innerText = data.counts.daily.crate;
        document.getElementById('dailyKeg').innerText = data.counts.daily.keg;

        document.getElementById('monthlyTotal').innerText = data.counts.monthly.total;
        document.getElementById('monthlyCrate').innerText = data.counts.monthly.crate;
        document.getElementById('monthlyKeg').innerText = data.counts.monthly.keg;

        const activeTrucks = data.activeTrucks || [];
        document.getElementById('activeBadge').innerText = `${activeTrucks.length} Active`;

        if (activeTrucks.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-slate-500">No active trucks inside the yard</td></tr>`;
          return;
        }

        tbody.innerHTML = activeTrucks.map((item) => `
          <tr class="hover:bg-slate-700/30 transition border-b border-slate-700/30 text-slate-200">
            <td class="py-4 px-5 font-black text-white">${item.truckNo}</td>
            <td class="py-4 px-5">${item.cargoType}</td>
            <td class="py-4 px-5 text-slate-400">${item.soNo || '-'}</td>
            <td class="py-4 px-5 text-slate-300">${item.ocName || '-'}</td>
            <td class="py-4 px-5 text-xs text-slate-400 font-mono">${item.gateIn ? new Date(item.gateIn).toLocaleString() : '-'}</td>
            <td class="py-4 px-5">
              <span class="px-2.5 py-1 bg-amber-500/10 text-amber-300 border border-amber-500/30 text-xs rounded-lg">Active</span>
            </td>
          </tr>
        `).join('');

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-rose-400 font-semibold">Failed to fetch data from TRT_Master_Database</td></tr>`;
      }
    }

    // Initial Load
    refreshData();

    // Auto Refresh Queue Every 30 Seconds
    setInterval(refreshData, 30000);
  </script>
</body>
</html>
