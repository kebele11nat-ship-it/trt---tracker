<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRT Tracker - Operation Controller</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-8 font-sans">
  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- HEADER -->
    <div class="bg-blue-900 text-white p-6 rounded-xl shadow-xl flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">TRT Tracker</h1>
        <p class="text-blue-200 text-sm">Operation Controller Terminal</p>
      </div>
      <button onclick="fetchActiveTrucks()" class="bg-blue-800 hover:bg-blue-700 text-xs px-3 py-2 rounded-lg border border-blue-600 transition">
        🔄 Refresh List
      </button>
    </div>

    <!-- PENDING / UNCHECKED-OUT TRUCKS SECTION -->
    <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-800">Trucks Currently in Yard (Active)</h2>
        <span id="activeCount" class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded-full">0 Active</span>
      </div>
      <p class="text-xs text-slate-500 mb-3">Click on any truck below to load its details into the form for updating.</p>
      
      <div id="activeTrucksList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-60 overflow-y-auto p-1">
        <div class="text-sm text-slate-400 italic col-span-2">Loading active trucks...</div>
      </div>
    </div>

    <!-- ENTRY / EDIT FORM -->
    <div class="bg-white p-6 rounded-xl shadow-xl border border-slate-200">
      <h2 class="text-lg font-bold text-slate-800 mb-4" id="formHeader">Log New / Update Truck Record</h2>
      
      <form id="trtForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Truck / Plate No. *</label>
            <input type="text" id="truckNo" required placeholder="e.g. 3-12345" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Driver Name</label>
            <input type="text" id="driverName" placeholder="Driver Name" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">1. Gate In</label>
            <input type="datetime-local" id="gateIn" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">2. Bay In</label>
            <input type="datetime-local" id="bayIn" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">3. Bay Out</label>
            <input type="datetime-local" id="bayOut" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">4. Gate Out</label>
            <input type="datetime-local" id="gateOut" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Delay Reason (If applicable)</label>
          <select id="delayReason" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
            <option value="On Time">None (On Time)</option>
            <option value="Bay Congestion">Bay Congestion</option>
            <option value="Forklift Downtime">Forklift Downtime</option>
            <option value="Documentation Delay">Documentation Delay</option>
            <option value="Staging Area Wait">Staging Area Wait</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">OC Operational Notes</label>
          <textarea id="ocNotes" rows="2" placeholder="Add additional remarks..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none"></textarea>
        </div>

        <div class="flex gap-2">
          <button type="submit" id="submitBtn" class="flex-1 bg-blue-800 hover:bg-blue-900 text-white font-bold py-3.5 px-4 rounded-lg transition duration-200 shadow-md">
            Submit / Update Record
          </button>
          <button type="button" onclick="clearForm()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-3.5 rounded-lg">
            Clear
          </button>
        </div>
      </form>

      <div id="statusMsg" class="hidden p-4 mt-4 text-center rounded-lg font-medium"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQQzuTdknhYrhpkjSm0IRmEMCBmm-pkr03UTKwpYwl_mKfBA9DJ3iXY44L-Wmtpgxk/exec";
    let activeTrucksData = [];

    // Format ISO or Google Date strings for datetime-local input fields
    function formatDateForInput(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return "";
      const pad = (n) => (n < 10 ? '0' + n : n);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // Fetch active trucks from Google Apps Script
    async function fetchActiveTrucks() {
      const listContainer = document.getElementById('activeTrucksList');
      const countBadge = document.getElementById('activeCount');
      listContainer.innerHTML = `<div class="text-sm text-slate-400 italic col-span-2">Loading active trucks...</div>`;

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getActive`);
        const trucks = await response.json();
        activeTrucksData = trucks;

        countBadge.innerText = `${trucks.length} Active`;

        if (trucks.length === 0) {
          listContainer.innerHTML = `<div class="text-sm text-slate-400 italic col-span-2">No active trucks in yard.</div>`;
          return;
        }

        listContainer.innerHTML = trucks.map((t, idx) => `
          <div onclick="selectTruck(${idx})" class="p-3 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition">
            <div class="flex justify-between items-center">
              <span class="font-bold text-slate-800">${t.truckNo}</span>
              <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-medium">In Yard</span>
            </div>
            <div class="text-xs text-slate-500 mt-1">
              <span>Gate In: ${t.gateIn ? new Date(t.gateIn).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'N/A'}</span>
            </div>
          </div>
        `).join('');

      } catch (err) {
        listContainer.innerHTML = `<div class="text-sm text-red-500 italic col-span-2">Could not load active trucks. Click refresh.</div>`;
      }
    }

    // Populate form fields when a user selects an active truck card
    function selectTruck(index) {
      const t = activeTrucksData[index];
      if (!t) return;

      document.getElementById('truckNo').value = t.truckNo || "";
      document.getElementById('driverName').value = t.driverName || "";
      document.getElementById('gateIn').value = formatDateForInput(t.gateIn);
      document.getElementById('bayIn').value = formatDateForInput(t.bayIn);
      document.getElementById('bayOut').value = formatDateForInput(t.bayOut);
      document.getElementById('gateOut').value = formatDateForInput(t.gateOut);
      document.getElementById('delayReason').value = t.delayReason || "On Time";
      document.getElementById('ocNotes').value = t.ocNotes || "";

      document.getElementById('formHeader').innerText = `Updating Record: ${t.truckNo}`;
      window.scrollTo({ top: document.getElementById('trtForm').offsetTop - 20, behavior: 'smooth' });
    }

    function clearForm() {
      document.getElementById('trtForm').reset();
      document.getElementById('formHeader').innerText = "Log New / Update Truck Record";
    }

    // Handle Form Submit
    document.getElementById('trtForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('statusMsg');
      
      btn.disabled = true;
      btn.innerText = 'Saving...';
      msg.classList.add('hidden');

      const formData = new URLSearchParams();
      formData.append('truckNo', document.getElementById('truckNo').value);
      formData.append('driverName', document.getElementById('driverName').value);
      formData.append('gateIn', document.getElementById('gateIn').value);
      formData.append('bayIn', document.getElementById('bayIn').value);
      formData.append('bayOut', document.getElementById('bayOut').value);
      formData.append('gateOut', document.getElementById('gateOut').value);
      formData.append('delayReason', document.getElementById('delayReason').value);
      formData.append('ocNotes', document.getElementById('ocNotes').value);

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData.toString()
        });

        msg.innerText = 'Record saved successfully!';
        msg.className = 'p-4 mt-4 text-center rounded-lg font-medium bg-green-100 text-green-800 border border-green-200';
        clearForm();
        setTimeout(fetchActiveTrucks, 1500); // Reload active list after saving
      } catch (err) {
        msg.innerText = 'Error submitting record. Please try again.';
        msg.className = 'p-4 mt-4 text-center rounded-lg font-medium bg-red-100 text-red-800 border border-red-200';
      } finally {
        msg.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = 'Submit / Update Record';
      }
    });

    // Initial load
    fetchActiveTrucks();
  </script>
</body>
</html>
