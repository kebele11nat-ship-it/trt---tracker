<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>TRT Mobile Tracker</title>

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href="data:application/manifest+json;utf8,{
    %22name%22:%22TRT%20Yard%20Tracker%22,
    %22short_name%22:%22TRT%20App%22,
    %22start_url%22:%22.%22,
    %22display%22:%22standalone%22,
    %22background_color%22:%22#f8fafc%22,
    %22theme_color%22:%22#1e3a8a%22
  }">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    input, select, textarea, button { font-size: 16px !important; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12 font-sans select-none">

  <!-- MOBILE HEADER -->
  <header class="sticky top-0 z-50 bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold tracking-tight">TRT Yard Tracker</h1>
      <p class="text-xs text-blue-200">Terminal Operational Controller</p>
    </div>
    <button onclick="fetchActiveTrucks()" class="bg-blue-800 hover:bg-blue-700 active:scale-95 text-xs font-semibold px-3 py-2 rounded-lg border border-blue-600 transition">
      🔄 Refresh
    </button>
  </header>

  <main class="max-w-md mx-auto p-3 space-y-4">

    <!-- CATEGORIZED IN-YARD QUEUE -->
    <section class="bg-white p-4 rounded-xl shadow-md border border-slate-200 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wide">In-Yard Status Queue</h2>
        <span id="activeCount" class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full">0 Active</span>
      </div>

      <!-- CATEGORY 1: AT PARKING YARD -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <h3 class="text-xs font-bold text-slate-700 uppercase">🅿️ At Parking Yard (Awaiting Bay)</h3>
          <span id="parkingCount" class="text-[10px] font-bold text-slate-500">0 Trucks</span>
        </div>
        <div id="parkingTrucksList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
          <div class="text-xs text-slate-400 italic">Loading parking queue...</div>
        </div>
      </div>

      <hr class="border-slate-200" />

      <!-- CATEGORY 2: AT LOADING BAY -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <h3 class="text-xs font-bold text-slate-700 uppercase">🏭 At Loading Bay (In Operation)</h3>
          <span id="bayCount" class="text-[10px] font-bold text-slate-500">0 Trucks</span>
        </div>
        <div id="bayTrucksList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
          <div class="text-xs text-slate-400 italic">Loading bay queue...</div>
        </div>
      </div>
    </section>

    <!-- MAIN FORM -->
    <section class="bg-white p-4 rounded-xl shadow-lg border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-bold text-slate-800" id="formHeader">Log Truck Entry / Update</h2>
        <button type="button" onclick="clearForm()" class="text-xs text-slate-500 underline">Reset</button>
      </div>

      <form id="trtForm" class="space-y-4">
        <!-- TRUCK & DRIVER -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Truck / Plate *</label>
            <input type="text" id="truckNo" required placeholder="e.g. 3-12345" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Driver Name</label>
            <input type="text" id="driverName" placeholder="Driver" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50" />
          </div>
        </div>

        <!-- SO & OC -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">SO Number</label>
            <input type="text" id="soNo" placeholder="Sales Order" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Controller (OC)</label>
            <select id="ocName" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50">
              <option value="">Select OC</option>
              <option value="Misgana">Misgana</option>
              <option value="Habtamu">Habtamu</option>
              <option value="Tilahun">Tilahun</option>
              <option value="Desalegn">Desalegn</option>
              <option value="Mihret">Mihret</option>
              <option value="Emshaw">Emshaw</option>
            </select>
          </div>
        </div>

        <!-- MOBILE TIMESTAMPS WITH 1-TAP NOW BUTTONS -->
        <div class="space-y-3 pt-2">
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-[11px] font-bold text-slate-700 uppercase">1. Gate In</label>
              <button type="button" onclick="setNow('gateIn')" class="text-xs bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded active:scale-95">⚡ Set Now</button>
            </div>
            <input type="datetime-local" id="gateIn" onchange="calculateMetrics()" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" />
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-[11px] font-bold text-slate-700 uppercase">2. Bay In</label>
              <button type="button" onclick="setNow('bayIn')" class="text-xs bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded active:scale-95">⚡ Set Now</button>
            </div>
            <input type="datetime-local" id="bayIn" onchange="calculateMetrics()" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" />
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-[11px] font-bold text-slate-700 uppercase">3. Bay Out</label>
              <button type="button" onclick="setNow('bayOut')" class="text-xs bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded active:scale-95">⚡ Set Now</button>
            </div>
            <input type="datetime-local" id="bayOut" onchange="calculateMetrics()" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" />
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-[11px] font-bold text-slate-700 uppercase">4. Gate Out</label>
              <button type="button" onclick="setNow('gateOut')" class="text-xs bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded active:scale-95">⚡ Set Now</button>
            </div>
            <input type="datetime-local" id="gateOut" onchange="calculateMetrics()" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" />
          </div>
        </div>

        <!-- METRICS DISPLAY CARD -->
        <div class="grid grid-cols-3 gap-1 bg-slate-800 text-white p-3 rounded-xl text-center shadow-inner mt-3">
          <div>
            <span class="block text-[9px] font-bold text-slate-400 uppercase">Parking</span>
            <span id="dispParking" class="text-xs font-bold text-amber-300">-- min</span>
          </div>
          <div>
            <span class="block text-[9px] font-bold text-slate-400 uppercase">Loading</span>
            <span id="dispLoading" class="text-xs font-bold text-amber-300">-- min</span>
          </div>
          <div>
            <span class="block text-[9px] font-bold text-slate-400 uppercase">Total TRT</span>
            <span id="dispTotal" class="text-xs font-bold text-green-400">-- min</span>
          </div>
        </div>

        <!-- DELAY REASON -->
        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Delay Reason</label>
          <select id="delayReason" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50">
            <option value="On Time">None (On Time)</option>
            <option value="Product Shortage">Product Shortage</option>
            <option value="Truck Shortage">Truck Shortage</option>
            <option value="Bay Congestion">Bay Congestion</option>
            <option value="Loading Capacity">Loading Capacity</option>
            <option value="Forklift breakdown">Forklift breakdown</option>
            <option value="Manpower shortage">Manpower shortage</option>
            <option value="Weather Condition">Weather Condition</option>
            <option value="FGS Gate Key">FGS Gate Key</option>
            <option value="Documentation Delay">Documentation Delay</option>
            <option value="Pallet Shortage">Pallet Shortage</option>
            <option value="ERP Malfunction">ERP Malfunction</option>
          </select>
        </div>

        <!-- NOTES -->
        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">OC Operational Notes</label>
          <textarea id="ocNotes" rows="2" placeholder="Optional notes..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50"></textarea>
        </div>

        <!-- SUBMIT BUTTON -->
        <button type="submit" id="submitBtn" class="w-full bg-blue-900 active:bg-blue-800 text-white font-bold py-4 rounded-xl shadow-lg transition duration-150 active:scale-[0.98]">
          💾 Save & Update Record
        </button>
      </form>

      <div id="statusMsg" class="hidden p-3 mt-3 text-center rounded-lg font-bold text-sm"></div>
    </section>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQQzuTdknhYrhpkjSm0IRmEMCBmm-pkr03UTKwpYwl_mKfBA9DJ3iXY44L-Wmtpgxk/exec";
    let activeTrucksData = [];

    function setNow(fieldId) {
      const now = new Date();
      const pad = (n) => (n < 10 ? '0' + n : n);
      const formatted = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
      document.getElementById(fieldId).value = formatted;
      calculateMetrics();
    }

    function formatDateForInput(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return "";
      const pad = (n) => (n < 10 ? '0' + n : n);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function calculateMetrics() {
      const gIn = document.getElementById('gateIn').value;
      const bIn = document.getElementById('bayIn').value;
      const bOut = document.getElementById('bayOut').value;
      const gOut = document.getElementById('gateOut').value;

      let pMin = "--", lMin = "--", tMin = "--";

      if (gIn && bIn) {
        const diff = Math.round((new Date(bIn) - new Date(gIn)) / (1000 * 60));
        pMin = (diff >= 0 ? diff : 0) + " min";
      }
      if (bIn && bOut) {
        const diff = Math.round((new Date(bOut) - new Date(bIn)) / (1000 * 60));
        lMin = (diff >= 0 ? diff : 0) + " min";
      }
      if (gIn && gOut) {
        const diff = Math.round((new Date(gOut) - new Date(gIn)) / (1000 * 60));
        tMin = (diff >= 0 ? diff : 0) + " min";
      }

      document.getElementById('dispParking').innerText = pMin;
      document.getElementById('dispLoading').innerText = lMin;
      document.getElementById('dispTotal').innerText = tMin;
    }

    function getElapsedTimeMinutes(startTimeStr) {
      if (!startTimeStr) return 0;
      const start = new Date(startTimeStr);
      if (isNaN(start.getTime())) return 0;
      const now = new Date();
      const diffMin = Math.round((now - start) / (1000 * 60));
      return diffMin >= 0 ? diffMin : 0;
    }

    function formatHours(minutes) {
      const hrs = (minutes / 60).toFixed(1);
      return `${minutes} min (${hrs} hrs)`;
    }

    async function fetchActiveTrucks() {
      const parkingContainer = document.getElementById('parkingTrucksList');
      const bayContainer = document.getElementById('bayTrucksList');
      const countBadge = document.getElementById('activeCount');
      
      parkingContainer.innerHTML = `<div class="text-xs text-slate-400 italic">Updating parking queue...</div>`;
      bayContainer.innerHTML = `<div class="text-xs text-slate-400 italic">Updating bay queue...</div>`;

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getActive`);
        const trucks = await response.json();
        activeTrucksData = trucks;

        countBadge.innerText = `${trucks.length} Active`;

        const parkingTrucks = [];
        const bayTrucks = [];

        // Categorize trucks based on timestamp progress
        trucks.forEach((t, idx) => {
          t.originalIndex = idx; // Keep reference to main data array
          if (t.gateIn && (!t.bayIn || t.bayIn === "")) {
            parkingTrucks.push(t);
          } else if (t.bayIn) {
            bayTrucks.push(t);
          }
        });

        document.getElementById('parkingCount').innerText = `${parkingTrucks.length} Trucks`;
        document.getElementById('bayCount').innerText = `${bayTrucks.length} Trucks`;

        // RENDER PARKING QUEUE
        if (parkingTrucks.length === 0) {
          parkingContainer.innerHTML = `<div class="text-xs text-slate-400 italic">No trucks in parking yard.</div>`;
        } else {
          parkingContainer.innerHTML = parkingTrucks.map(t => {
            const elapsed = getElapsedTimeMinutes(t.gateIn);
            const isDelayed = elapsed > 180; // 3 hours (180 mins)
            const badgeClass = isDelayed ? "bg-red-100 text-red-800 border-red-300" : "bg-emerald-100 text-emerald-800 border-emerald-300";
            const cardBorder = isDelayed ? "border-red-300 bg-red-50/50" : "border-slate-200 bg-slate-50";

            return `
              <div onclick="selectTruck(${t.originalIndex})" class="p-2.5 rounded-lg border ${cardBorder} active:bg-blue-100 transition shadow-sm cursor-pointer">
                <div class="flex justify-between items-center mb-1">
                  <span class="font-bold text-slate-800 text-sm">${t.truckNo}</span>
                  <span class="text-[10px] border ${badgeClass} px-2 py-0.5 rounded-full font-bold">
                    ${isDelayed ? '🚨 > 3 hrs' : '🟢 < 3 hrs'} (${formatHours(elapsed)})
                  </span>
                </div>
                <div class="text-xs text-slate-600 flex justify-between">
                  <span><b>SO:</b> ${t.soNo || 'N/A'}</span>
                  <span><b>OC:</b> ${t.ocName || 'N/A'}</span>
                </div>
              </div>
            `;
          }).join('');
        }

        // RENDER BAY QUEUE
        if (bayTrucks.length === 0) {
          bayContainer.innerHTML = `<div class="text-xs text-slate-400 italic">No trucks at loading bays.</div>`;
        } else {
          bayContainer.innerHTML = bayTrucks.map(t => {
            let elapsed = 0;
            if (t.bayOut) {
              // If finished loading but waiting for Gate Out
              elapsed = calculateDiffInMinutes(t.bayIn, t.bayOut);
            } else {
              // Still actively loading
              elapsed = getElapsedTimeMinutes(t.bayIn);
            }

            const isDelayed = elapsed > 180; // 3 hours (180 mins)
            const badgeClass = isDelayed ? "bg-red-100 text-red-800 border-red-300" : "bg-emerald-100 text-emerald-800 border-emerald-300";
            const cardBorder = isDelayed ? "border-red-300 bg-red-50/50" : "border-slate-200 bg-slate-50";

            return `
              <div onclick="selectTruck(${t.originalIndex})" class="p-2.5 rounded-lg border ${cardBorder} active:bg-blue-100 transition shadow-sm cursor-pointer">
                <div class="flex justify-between items-center mb-1">
                  <span class="font-bold text-slate-800 text-sm">${t.truckNo}</span>
                  <span class="text-[10px] border ${badgeClass} px-2 py-0.5 rounded-full font-bold">
                    ${isDelayed ? '🚨 > 3 hrs' : '🟢 < 3 hrs'} (${formatHours(elapsed)})
                  </span>
                </div>
                <div class="text-xs text-slate-600 flex justify-between">
                  <span><b>SO:</b> ${t.soNo || 'N/A'}</span>
                  <span><b>OC:</b> ${t.ocName || 'N/A'}</span>
                </div>
              </div>
            `;
          }).join('');
        }

      } catch (err) {
        parkingContainer.innerHTML = `<div class="text-xs text-red-500 italic">Error loading queue. Tap Refresh.</div>`;
        bayContainer.innerHTML = ``;
      }
    }

    function selectTruck(index) {
      const t = activeTrucksData[index];
      if (!t) return;

      document.getElementById('truckNo').value = t.truckNo || "";
      document.getElementById('driverName').value = t.driverName || "";
      document.getElementById('soNo').value = t.soNo || "";
      document.getElementById('ocName').value = t.ocName || "";
      document.getElementById('gateIn').value = formatDateForInput(t.gateIn);
      document.getElementById('bayIn').value = formatDateForInput(t.bayIn);
      document.getElementById('bayOut').value = formatDateForInput(t.bayOut);
      document.getElementById('gateOut').value = formatDateForInput(t.gateOut);
      document.getElementById('delayReason').value = t.delayReason || "On Time";
      document.getElementById('ocNotes').value = t.ocNotes || "";

      calculateMetrics();
      document.getElementById('formHeader').innerText = `Editing: ${t.truckNo}`;
      window.scrollTo({ top: document.getElementById('trtForm').offsetTop - 60, behavior: 'smooth' });
    }

    function clearForm() {
      document.getElementById('trtForm').reset();
      document.getElementById('dispParking').innerText = "-- min";
      document.getElementById('dispLoading').innerText = "-- min";
      document.getElementById('dispTotal').innerText = "-- min";
      document.getElementById('formHeader').innerText = "Log Truck Entry / Update";
    }

    document.getElementById('trtForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('statusMsg');
      
      btn.disabled = true;
      btn.innerText = 'Saving Record...';
      msg.classList.add('hidden');

      const formData = new URLSearchParams();
      formData.append('truckNo', document.getElementById('truckNo').value);
      formData.append('driverName', document.getElementById('driverName').value);
      formData.append('soNo', document.getElementById('soNo').value);
      formData.append('ocName', document.getElementById('ocName').value);
      formData.append('gateIn', document.getElementById('gateIn').value);
      formData.append('bayIn', document.getElementById('bayIn').value);
      formData.append('bayOut', document.getElementById('bayOut').value);
      formData.append('gateOut', document.getElementById('gateOut').value);
      formData.append('delayReason', document.getElementById('delayReason').value);
      formData.append('ocNotes', document.getElementById('ocNotes').value);

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData.toString()
        });

        msg.innerText = '✓ Saved Successfully!';
        msg.className = 'p-3 mt-3 text-center rounded-lg font-bold text-sm bg-green-100 text-green-800 border border-green-300';
        clearForm();
        setTimeout(fetchActiveTrucks, 1200);
      } catch (err) {
        msg.innerText = '❌ Error saving record!';
        msg.className = 'p-3 mt-3 text-center rounded-lg font-bold text-sm bg-red-100 text-red-800 border border-red-300';
      } finally {
        msg.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = '💾 Save & Update Record';
      }
    });

    fetchActiveTrucks();
  </script>
</body>
</html>
